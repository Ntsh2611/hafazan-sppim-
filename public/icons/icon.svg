<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f24" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022119" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer subtle gold ring -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.4" />
  <circle cx="256" cy="256" r="200" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6,8" opacity="0.3" />

  <!-- Crescent moon behind book -->
  <path d="M 330 140 A 130 130 0 1 0 350 330 A 108 108 0 1 1 290 155 A 120 120 0 0 0 330 140 Z" fill="url(#goldGrad)" opacity="0.35" />

  <!-- Radiant 8-pointed star at top -->
  <g transform="translate(256, 120) scale(0.7)" filter="url(#glow)">
    <polygon points="0,-35 9,-11 35,-11 15,5 22,30 0,16 -22,30 -15,5 -35,-11 -9,-11" fill="url(#goldGrad)" />
    <circle cx="0" cy="5" r="5" fill="#fef08a" />
  </g>

  <!-- Open Quran Book Motif -->
  <g transform="translate(256, 290)" filter="url(#glow)">
    <!-- Book Stand / Rehal shadow -->
    <path d="M -140 100 L 0 50 L 140 100 L 90 120 L 0 75 L -90 120 Z" fill="#021a14" opacity="0.6" />

    <!-- Left Page -->
    <path d="M -8 20 C -60 -10 -130 -15 -180 -2 C -185 2 -188 8 -188 15 L -188 75 C -188 82 -183 88 -176 87 C -128 75 -65 80 -8 110 Z" fill="#f8fafc" />
    <!-- Left Page Inner Shading -->
    <path d="M -20 28 C -68 5 -125 0 -172 13 L -172 73 C -125 60 -68 65 -20 88 Z" fill="#ecfdf5" opacity="0.9" />
    <!-- Left Page Arabic script lines -->
    <line x1="-155" y1="28" x2="-35" y2="38" stroke="#047857" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    <line x1="-155" y1="44" x2="-45" y2="54" stroke="#047857" stroke-width="3" stroke-linecap="round" opacity="0.65" />
    <line x1="-155" y1="60" x2="-55" y2="70" stroke="#047857" stroke-width="3" stroke-linecap="round" opacity="0.6" />

    <!-- Right Page -->
    <path d="M 8 20 C 60 -10 130 -15 180 -2 C 185 2 188 8 188 15 L 188 75 C 188 82 183 88 176 87 C 128 75 65 80 8 110 Z" fill="#f8fafc" />
    <!-- Right Page Inner Shading -->
    <path d="M 20 28 C 68 5 125 0 172 13 L 172 73 C 125 60 68 65 20 88 Z" fill="#ecfdf5" opacity="0.9" />
    <!-- Right Page Arabic script lines -->
    <line x1="35" y1="38" x2="155" y2="28" stroke="#047857" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    <line x1="45" y1="54" x2="155" y2="44" stroke="#047857" stroke-width="3" stroke-linecap="round" opacity="0.65" />
    <line x1="55" y1="70" x2="155" y2="60" stroke="#047857" stroke-width="3" stroke-linecap="round" opacity="0.6" />

    <!-- Spine / Center Ribbon -->
    <path d="M -8 15 L 8 15 L 8 112 L -8 112 Z" fill="url(#goldGrad)" />
    <!-- Bookmark ribbon dropping down -->
    <path d="M -4 95 L 4 95 L 4 140 L 0 132 L -4 140 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Typography: SPPIM -->
  <text x="256" y="445" font-family="'Nunito', sans-serif" font-weight="800" font-size="34" fill="#fbbf24" text-anchor="middle" letter-spacing="4">HAFAZAN SPPIM</text>
</svg>
